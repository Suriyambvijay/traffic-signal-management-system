<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — Smart Traffic Signal Management</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="mark">ST</div>
      <div><h1>Smart Traffic AI</h1><span>Signal Management System</span></div>
    </div>
    <h2>Create an account</h2>
    <p class="sub">Sign up to start monitoring and controlling traffic signals.</p>

    <div class="auth-error" id="authError"></div>

    <form id="signupForm" novalidate>
      <div class="mb-3">
        <label class="form-label" for="name">Full name</label>
        <input type="text" class="form-control" id="name" placeholder="Jordan Lee" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input type="email" class="form-control" id="email" placeholder="you@department.gov" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-control" id="password" placeholder="At least 6 characters" required minlength="6">
      </div>
      <div class="mb-3">
        <label class="form-label" for="confirm">Confirm password</label>
        <input type="password" class="form-control" id="confirm" placeholder="Re-enter your password" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary w-100" id="submitBtn">Create account</button>
    </form>

    <div class="auth-foot">Already have an account? <a href="login.html">Log in</a></div>

    <div class="demo-note">
      Creates a Firebase Auth user and a matching <code>users/&lt;uid&gt;</code> profile document in Firestore.
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
  redirectIfAuthed("dashboard.html");

  const form = document.getElementById("signupForm");
  const errEl = document.getElementById("authError");
  const btn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errEl.style.display = "none";
    const pw = document.getElementById("password").value;
    const cpw = document.getElementById("confirm").value;
    if (pw !== cpw) {
      showAuthError(errEl, "Passwords don't match.");
      return;
    }
    btn.disabled = true; btn.textContent = "Creating account…";
    try {
      await signUpUser(
        document.getElementById("name").value.trim(),
        document.getElementById("email").value.trim(),
        pw
      );
      window.location.href = "dashboard.html";
    } catch (err) {
      showAuthError(errEl, friendlyAuthError(err.code));
      btn.disabled = false; btn.textContent = "Create account";
    }
  });
</script>
</body>
</html>
