<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Smart Traffic Signal Management</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="mark">ST</div>
      <div><h1>Smart Traffic AI</h1><span>Signal Management System</span></div>
    </div>
    <h2>Welcome back</h2>
    <p class="sub">Log in to access the traffic control dashboard.</p>

    <div class="auth-error" id="authError"></div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input type="email" class="form-control" id="email" placeholder="you@department.gov" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100" id="submitBtn">Log in</button>
    </form>

    <div class="auth-foot">Don't have an account? <a href="signup.html">Sign up</a></div>

    <div class="demo-note">
      Backed by Firebase Authentication. Configure your project keys in
      <code>js/firebase-config.js</code> before deploying.
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
  redirectIfAuthed("dashboard.html");

  const form = document.getElementById("loginForm");
  const errEl = document.getElementById("authError");
  const btn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errEl.style.display = "none";
    btn.disabled = true; btn.textContent = "Logging in…";
    try {
      await logInUser(document.getElementById("email").value.trim(), document.getElementById("password").value);
      window.location.href = "dashboard.html";
    } catch (err) {
      showAuthError(errEl, friendlyAuthError(err.code));
      btn.disabled = false; btn.textContent = "Log in";
    }
  });
</script>
</body>
</html>
