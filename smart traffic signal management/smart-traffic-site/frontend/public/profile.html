<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — Smart Traffic Signal Management</title>
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="topbar" id="topbar"></div>

<div class="wrap">
  <div class="alert-banner" id="alertBanner"><span id="alertText"></span></div>

  <div class="grid" style="grid-template-columns:1fr 1.4fr">
    <div class="card" style="text-align:center">
      <div id="bigAvatar" style="width:84px;height:84px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);
        display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:var(--text2);margin:6px auto 16px"></div>
      <div style="font-size:16px;font-weight:600" id="pName">—</div>
      <div style="font-size:12.5px;color:var(--text3);margin-top:2px" id="pEmail">—</div>
      <div class="tag low" style="margin-top:12px; display:inline-flex" id="pRole">operator</div>

      <div style="margin-top:22px; text-align:left">
        <table class="mini">
          <tr><td>Account created</td><td style="text-align:right" id="pCreated">—</td></tr>
          <tr><td>Detections logged</td><td style="text-align:right; font-family:var(--mono)" id="pDetections">—</td></tr>
          <tr><td>Events flagged</td><td style="text-align:right; font-family:var(--mono)" id="pEvents">—</td></tr>
        </table>
      </div>
      <div class="btnrow" style="justify-content:center">
        <button class="btn-app ghost" id="btnLogoutProfile">Log out</button>
      </div>
    </div>

    <div class="card">
      <h3>Edit profile</h3>
      <div class="auth-error" id="formError" style="display:none"></div>
      <div class="auth-error" id="formSuccess" style="display:none; background:rgba(51,196,129,.12); border-color:var(--green); color:#8be9c4"></div>

      <form id="profileForm">
        <div class="mb-3" style="margin-bottom:14px">
          <label class="form-label" style="display:block; margin-bottom:6px">Full name</label>
          <input type="text" id="nameInput" class="mini-input" style="width:100%; padding:9px 12px">
        </div>
        <div class="mb-3" style="margin-bottom:14px">
          <label class="form-label" style="display:block; margin-bottom:6px">Email</label>
          <input type="email" id="emailInput" class="mini-input" style="width:100%; padding:9px 12px" disabled>
          <div style="font-size:11px; color:var(--text3); margin-top:5px">Email changes require re-authentication — contact an admin.</div>
        </div>
        <button type="submit" class="btn-app">Save changes</button>
      </form>

      <h3 style="margin-top:26px">Change password</h3>
      <div class="auth-error" id="pwError" style="display:none"></div>
      <div class="auth-error" id="pwSuccess" style="display:none; background:rgba(51,196,129,.12); border-color:var(--green); color:#8be9c4"></div>
      <form id="pwForm">
        <div class="mb-3" style="margin-bottom:14px">
          <label class="form-label" style="display:block; margin-bottom:6px">New password</label>
          <input type="password" id="newPw" class="mini-input" style="width:100%; padding:9px 12px" minlength="6" placeholder="At least 6 characters">
        </div>
        <button type="submit" class="btn-app ghost">Update password</button>
      </form>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/navbar.js"></script>
<script>
let currentUser = null;

requireAuth((user) => {
  currentUser = user;
  renderNavbar("", user); // no active tab highlighted on profile page
  fillProfile(user);
});

function initialsOf(str) {
  return (str || "U").split(" ").map(s => s[0]).join("").slice(0, 2).toUpperCase();
}

function fillProfile(user) {
  document.getElementById("bigAvatar").textContent = initialsOf(user.displayName || user.email);
  document.getElementById("pName").textContent = user.displayName || "—";
  document.getElementById("pEmail").textContent = user.email;
  document.getElementById("nameInput").value = user.displayName || "";
  document.getElementById("emailInput").value = user.email;
  document.getElementById("pCreated").textContent = user.metadata?.creationTime
    ? new Date(user.metadata.creationTime).toLocaleDateString() : "—";

  db.collection("users").doc(user.uid).get().then((doc) => {
    if (doc.exists) document.getElementById("pRole").textContent = doc.data().role || "operator";
  }).catch(() => {});

  db.collection("users").doc(user.uid).collection("detections").get()
    .then((snap) => { document.getElementById("pDetections").textContent = snap.size; })
    .catch(() => { document.getElementById("pDetections").textContent = "—"; });

  db.collection("users").doc(user.uid).collection("events").get()
    .then((snap) => { document.getElementById("pEvents").textContent = snap.size; })
    .catch(() => { document.getElementById("pEvents").textContent = "—"; });
}

document.getElementById("profileForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errEl = document.getElementById("formError");
  const okEl = document.getElementById("formSuccess");
  errEl.style.display = "none"; okEl.style.display = "none";
  const newName = document.getElementById("nameInput").value.trim();
  try {
    await currentUser.updateProfile({ displayName: newName });
    await db.collection("users").doc(currentUser.uid).set({ name: newName }, { merge: true });
    document.getElementById("pName").textContent = newName;
    document.getElementById("bigAvatar").textContent = initialsOf(newName);
    okEl.textContent = "Profile updated.";
    okEl.style.display = "block";
  } catch (err) {
    errEl.textContent = friendlyAuthError(err.code);
    errEl.style.display = "block";
  }
});

document.getElementById("pwForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errEl = document.getElementById("pwError");
  const okEl = document.getElementById("pwSuccess");
  errEl.style.display = "none"; okEl.style.display = "none";
  const pw = document.getElementById("newPw").value;
  if (pw.length < 6) {
    errEl.textContent = "Password should be at least 6 characters.";
    errEl.style.display = "block";
    return;
  }
  try {
    await currentUser.updatePassword(pw);
    okEl.textContent = "Password updated.";
    okEl.style.display = "block";
    document.getElementById("newPw").value = "";
  } catch (err) {
    errEl.textContent = err.code === "auth/requires-recent-login"
      ? "For security, please log out and log back in before changing your password."
      : friendlyAuthError(err.code);
    errEl.style.display = "block";
  }
});

document.getElementById("btnLogoutProfile").addEventListener("click", logOutUser);
</script>
</body>
</html>
